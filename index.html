<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Gradient Studio</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Liquid Gradient Studio</span>
      </div>
      <div class="topbar-hint">Анимированные жидкие градиенты для hero-секций · экспорт в WebM / GIF</div>
    </header>

    <main class="layout">
      <section class="panel controls" aria-label="Настройки градиента">
        <div class="control-group">
          <h2>Пресеты</h2>
          <div id="presetList" class="preset-list"></div>
        </div>

        <div class="control-group">
          <h2>Цвета</h2>
          <div id="colorList" class="color-list"></div>
          <div class="row">
            <button id="addColorBtn" class="btn btn-secondary" type="button">+ Цвет</button>
            <button id="randomizeBtn" class="btn btn-secondary" type="button">🎲 Случайно</button>
          </div>
        </div>

        <div class="control-group">
          <h2>Форма потока</h2>
          <label class="field">
            <span>Масштаб узора <output id="scaleOut"></output></span>
            <input id="scale" type="range" min="0.6" max="5" step="0.05" />
          </label>
          <label class="field">
            <span>Искажение (liquid) <output id="warpOut"></output></span>
            <input id="warp" type="range" min="0" max="2.5" step="0.05" />
          </label>
          <label class="field">
            <span>Контраст цветовых зон <output id="softnessOut"></output></span>
            <input id="softness" type="range" min="0" max="1" step="0.01" />
          </label>
          <label class="field">
            <span>Скорость движения <output id="speedOut"></output></span>
            <input id="speed" type="range" min="0" max="1" step="0.01" />
          </label>
          <label class="field checkbox-field">
            <input id="circleMask" type="checkbox" />
            <span>Маска-круг (как на референсе)</span>
          </label>
          <label class="field" id="bgColorField" hidden>
            <span>Цвет фона вне круга</span>
            <input id="bgColor" type="color" />
          </label>
        </div>

        <div class="control-group">
          <h2>Разрешение</h2>
          <select id="resolutionPreset">
            <option value="1920x1080">Hero 1920×1080 (16:9)</option>
            <option value="1600x900">Hero 1600×900 (16:9)</option>
            <option value="1920x640">Широкий баннер 1920×640</option>
            <option value="1200x630">OG / соцсети 1200×630</option>
            <option value="1080x1080">Квадрат 1080×1080</option>
            <option value="custom">Свой размер…</option>
          </select>
          <div class="row" id="customSizeRow" hidden>
            <label class="field-inline">
              <span>Ширина</span>
              <input id="customWidth" type="number" min="64" max="3840" step="1" />
            </label>
            <label class="field-inline">
              <span>Высота</span>
              <input id="customHeight" type="number" min="64" max="3840" step="1" />
            </label>
          </div>
        </div>

        <div class="control-group">
          <h2>Экспорт</h2>
          <label class="field">
            <span>Длительность loop, сек <output id="durationOut"></output></span>
            <input id="duration" type="range" min="2" max="10" step="0.5" />
          </label>
          <label class="field">
            <span>FPS</span>
            <select id="fps">
              <option value="24">24</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
            </select>
          </label>
          <label class="field">
            <span>Макс. ширина GIF (px) <output id="gifWidthOut"></output></span>
            <input id="gifWidth" type="range" min="240" max="960" step="20" />
          </label>
          <p class="hint">GIF ограничен палитрой 256 цветов и весит намного больше WebM — используйте его для превью/соцсетей, а WebM для продакшн hero-секции.</p>
          <div class="row">
            <button id="exportWebmBtn" class="btn btn-primary" type="button">Экспорт WebM</button>
            <button id="exportGifBtn" class="btn btn-primary" type="button">Экспорт GIF</button>
          </div>
          <div id="exportProgress" class="progress" hidden>
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <span id="progressLabel"></span>
          </div>
        </div>
      </section>

      <section class="panel preview" aria-label="Превью">
        <div class="canvas-wrap">
          <canvas id="previewCanvas"></canvas>
        </div>
        <div id="results" class="results"></div>
      </section>
    </main>
  </div>

  <template id="colorRowTemplate">
    <div class="color-row">
      <input type="color" class="color-input" />
      <button type="button" class="btn-icon remove-color" title="Удалить цвет">✕</button>
    </div>
  </template>

  <template id="resultTemplate">
    <div class="result-card">
      <div class="result-preview"></div>
      <div class="result-meta">
        <span class="result-name"></span>
        <span class="result-size"></span>
      </div>
      <a class="btn btn-secondary result-download" download>Скачать</a>
    </div>
  </template>

  <script type="module" src="src/main.js"></script>
</body>
</html>
